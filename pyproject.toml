[project]
name = "giskardsuite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreyanth Suresh Krishnaa", email = "shreyanthsureshkrishnaa.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "giskard[scan]>=3.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "litellm>=1.100.1",
    "pandas>=3.0.5",
]

[project.scripts]
giskardsuite = "giskardsuite:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
